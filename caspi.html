<head>

<title>Caspi — NFC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700&display=swap">
<style>
:root{--ink:#0d3b57;--sky1:#62bdee;--sky2:#ffeccd;--sea0:#1a9fbd;--sea1:#1580ae;--sea2:#10629a;--sea3:#0c4577;--t1:#0c4a6e;--t2:#0e8fb5;--t3:#f2a93b;--gold:#f5c85b;--panel:rgba(10,45,70,.32);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6f4fa;--sky1:#1d4f73;--sky2:#4a6f86;--t1:#fff;--t2:#9fe3f5;--t3:#ffd66b}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff;background:var(--sea3);overflow-x:hidden}
.hero{position:relative;height:100svh;min-height:560px;background:linear-gradient(var(--sky1),var(--sky2));color:var(--ink);overflow:hidden;text-align:center}
.hero .txt{position:relative;z-index:2;padding:15vh 20px 0}
.kick{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;opacity:.8}
h1{font-family:"Unbounded","Manrope",sans-serif;font-size:clamp(50px,13vw,140px);line-height:1.1;margin:8px 0 0;padding-left:.12em;font-weight:700;letter-spacing:.12em;background:linear-gradient(180deg,var(--t1),var(--t2) 70%,var(--t3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(255,255,255,.6)) drop-shadow(0 10px 16px rgba(13,59,87,.25))}
.sub{max-width:520px;margin:0 auto 22px;font-size:clamp(15px,2.4vw,19px);font-weight:500}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .btn{background:#e6f4fa;color:#0d3b57}}
.sky{position:absolute;left:0;bottom:0;width:100%;height:62%;z-index:1}
.wave{position:absolute;left:0;bottom:-1px;width:200%;height:90px;z-index:3;animation:w 16s linear infinite}
.wave.b{height:70px;opacity:.5;animation-duration:24s;animation-direction:reverse;z-index:2}
@keyframes w{to{transform:translateX(-50%)}}
.hint{position:absolute;z-index:4;bottom:96px;left:0;right:0;font-size:13px;color:#fff;font-weight:700;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.sea{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sea0) 0,var(--sea1) 35%,var(--sea2) 70%,var(--sea3) 100%)}
section{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:90px 22px;text-align:center}
h2{font-size:clamp(30px,5vw,46px);margin:0 0 12px;font-weight:800;text-shadow:0 2px 12px rgba(0,30,50,.35)}
.lead{max-width:560px;margin:0 auto 34px;font-size:17px;opacity:.95}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.panel{background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:26px 22px}
.panel b{display:block;font-size:20px;margin:6px 0}
.num{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#0d3b57;font-weight:800}
.stage{position:relative;height:620px;max-width:340px;margin:0 auto;overflow:hidden}
.sticker{position:absolute;z-index:1;left:50%;top:0;width:230px;margin-left:-115px;filter:drop-shadow(0 12px 18px rgba(0,25,50,.45))}
.sticker svg{display:block;width:100%}
.phone{position:absolute;z-index:2;left:50%;top:210px;width:200px;height:380px;margin-left:-100px;border-radius:36px;border:6px solid #0b0b0e;background:#111;overflow:hidden;box-shadow:0 20px 40px rgba(0,20,40,.5);transform:translateY(100px) rotate(-5deg);transition:transform 1s cubic-bezier(.3,.7,.3,1)}
.phone:before{content:"";position:absolute;z-index:5;top:8px;left:50%;width:62px;height:18px;margin-left:-31px;border-radius:12px;background:#000}
.stage.tap .phone{transform:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .5s}
.idle{align-items:center;justify-content:center;gap:6px;background:linear-gradient(160deg,#1b6fa8,#12345a 70%);color:#fff}
.idle b{font-size:52px;line-height:1}.idle span{font-size:12px;opacity:.85}
.rev{opacity:0;background:#fff;color:#1b2b38;padding:38px 14px 14px;gap:8px;text-align:left}
.phone.on .idle{opacity:0}.phone.on .rev{opacity:1}
.rh{display:flex;gap:8px;align-items:center}.rh svg{width:28px;height:28px}
.rev h4{margin:0;font-size:14px}.rev small{color:#667;font-size:10px}
.stars{display:flex;gap:2px}.stars svg{width:30px;height:30px}.stars path{fill:#d6dbe0}
.phone.on .stars path{animation:st .35s forwards;animation-delay:calc(var(--n)*.15s + .5s)}
@keyframes st{to{fill:#f5b700}}
.txt2{flex:1;border:1px solid #dadce0;border-radius:10px;padding:10px;font-size:12px;line-height:1.45}
.fake{align-self:flex-end;padding:8px 16px;border-radius:999px;background:#1a73e8;color:#fff;font-size:12px;font-weight:700}
.ring{position:absolute;z-index:3;left:50%;top:222px;width:20px;height:20px;margin:-10px;border-radius:50%;border:3px solid var(--gold);opacity:0}
.stage.tap .ring{animation:rg 1.1s ease-out 1s 2}
@keyframes rg{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(9)}}
.ul{display:block;width:170px;margin:0 auto 16px}
.sub{max-width:560px;font-size:clamp(17px,2.8vw,22px);line-height:1.75}
.sub em{font-style:normal;font-weight:800;padding:.05em .35em;border-radius:.4em;background:var(--gold);color:#0d3b57;white-space:nowrap}
.car{animation:drive linear infinite}
@keyframes drive{from{transform:translateX(-120px)}to{transform:translateX(1260px)}}
@media (max-width:700px){.sky{height:340px;bottom:40px}}
.life{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fish{position:absolute;left:100%;height:auto;animation:sw linear infinite}
.fish.r{left:0;scale:-1 1;animation-name:swr}
@keyframes sw{to{transform:translateX(calc(-100vw - 100%))}}
@keyframes swr{from{transform:translateX(100%)}to{transform:translateX(calc(-100vw - 100%))}}
.weed{position:absolute;bottom:20px;transform-origin:50% 100%;animation:sway ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.sand{position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(#d9bf86,#b99a5f)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.chips span{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:700;font-size:14px}
.price{font-size:54px;font-weight:800;color:var(--gold);line-height:1.1}
.panel p{margin:6px 0 0;opacity:.9}
.note{margin-top:22px;opacity:.85}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.cta a{padding:15px 26px;border-radius:999px;font-weight:800;text-decoration:none;color:#0d3b57;background:var(--gold)}
.cta a.o{background:#fff}
footer{position:relative;z-index:1;padding:30px 20px 140px;text-align:center;font-size:13px;opacity:.7}
#lang{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top,0px));right:14px;font-family:inherit}
#lang button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(13,59,87,.75);color:#fff;font:700 13px inherit;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#lang ul{display:none;list-style:none;margin:6px 0 0;padding:6px;border-radius:16px;background:rgba(13,59,87,.92)}
#lang.open ul{display:block}
#lang li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
#lang li:hover{background:rgba(255,255,255,.15)}
svg.fl{width:24px;height:16px;border-radius:3px;display:block}
#depth{position:fixed;z-index:10;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:8px 14px;border-radius:999px;background:rgba(13,59,87,.7);font-weight:800;font-size:14px;color:#fff}
#bub{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;overflow:hidden}
#bub span{position:absolute;bottom:-30px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
